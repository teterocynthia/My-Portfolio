{% extends "base.html" %}

{% block title %}Contact — {{ profile.name if profile else 'My Portfolio' }}{% endblock %}

{% block content %}
<section class="py-16 bg-white">
    <div class="max-w-2xl mx-auto px-4">
        <h1 class="text-4xl font-bold text-center mb-8">Contact Me</h1>

        <form method="post" action="{{ url_for('contact') }}" class="space-y-6">
            <div>
                <label class="block text-sm font-medium mb-2">Name</label>
                <input name="name" type="text" required class="w-full px-4 py-3 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">Email</label>
                <input name="email" type="email" required class="w-full px-4 py-3 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">Message</label>
                <textarea name="message" rows="6" required class="w-full px-4 py-3 border rounded-lg"></textarea>
            </div>
            <button type="submit" class="w-full bg-amber-600 text-white py-3 rounded-lg font-semibold">
                Send Message
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-sm text-gray-600">Or reach me directly at <a href="mailto:{{ profile.email if profile and profile.email else '#' }}" class="underline">{{ profile.email if profile and profile.email else 'your-email@example.com' }}</a></p>
        </div>
    </div>
</section>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<section class="py-16 bg-white">
    <div class="max-w-2xl mx-auto px-4">
        <h1 class="text-4xl font-bold text-center mb-8">Contact Me</h1>
        <form class="space-y-6">
            <div>
                <label class="block text-sm font-medium mb-2">Name</label>
                <input type="text" class="w-full px-4 py-3 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">Email</label>
                <input type="email" class="w-full px-4 py-3 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">Message</label>
                <textarea rows="6" class="w-full px-4 py-3 border rounded-lg"></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold">
                Send Message
            </button>
        </form>
    </div>
</section>
{% endblock %}

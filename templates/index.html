{% extends "base.html" %}

{% block content %}
<section class="bg-gradient-to-r from-blue-600 to-purple-700 text-white py-20">
    <div class="max-w-7xl mx-auto px-4 text-center">
        <h1 class="text-5xl font-bold mb-6">Hi, I'm Your Name</h1>
        <p class="text-xl mb-8">Full-Stack Developer</p>
        <a href="#projects" class="bg-white text-blue-600 px-8 py-3 rounded-lg font-semibold">
            View My Work
        </a>
    </div>
</section>

<section id="projects" class="py-16 bg-white">
    <div class="max-w-7xl mx-auto px-4">
        <h2 class="text-3xl font-bold text-center mb-12">Featured Projects</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            {% for project in projects %}
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                <div class="h-48 bg-gradient-to-r from-blue-400 to-purple-500 flex items-center justify-center">
                    <i class="fas fa-code text-white text-6xl"></i>
                </div>
                <div class="p-6">
                    <h3 class="text-xl font-semibold mb-2">{{ project.title }}</h3>
                    <p class="text-gray-600 mb-4">{{ project.description }}</p>
                    <div class="flex space-x-4">
                        <a href="{{ project.github_url }}" class="text-blue-500">Code</a>
                        <a href="{{ project.live_url }}" class="text-blue-500">Live Demo</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
